name: 실시간 이슈 체크 갱신

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분씩 밀릴 수 있음)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 검색어 수집 + 페이지 생성
        run: python trend_site.py
      - name: 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend_history.json
          if ! git diff --cached --quiet; then
            git commit -q -m "기록 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
            git pull -q --rebase || true
            git push -q
          fi
      - name: Cloudflare Pages 업로드 (issue-check.pages.dev)
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffaa19018f74ae27bb594cf3259c7e58
        run: |
          npx --yes wrangler@3 pages project create issue-check --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=issue-check --branch=main --commit-dirty=true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
